                - heading "Conformity Judge" [level=2] [ref=e590]
                - paragraph [ref=e591]: "The Conformity Judge is a local, offline read on how well new code fits the patterns already in your codebase. It has two complementary lenses:"
                - list [ref=e592]:
                  - listitem [ref=e593]:
                    - strong [ref=e594]: Decision/style conformity — the PRIMARY signal.
                    - text: A deterministic, explainable check of the discrete, interchangeable coding
                    - emphasis [ref=e595]: decisions
                    - text: a function makes — the curated axes
                    - code [ref=e596]: var_decl
                    - text: ","
                    - code [ref=e597]: string_style
                    - text: ","
                    - code [ref=e598]: async_style
                    - text: ","
                    - code [ref=e599]: array_syntax
                    - text: ","
                    - code [ref=e600]: export_style
                    - text: — against an
                    - strong [ref=e601]: effective target
                    - text: "(the codebase's own preferred value per axis). Each finding is a flat fact you can act on: \"uses"
                    - code [ref=e602]: let
                    - text: ; target is
                    - code [ref=e603]: const
                    - text: "\". No model, no embeddings, no fuzziness."
                  - listitem [ref=e604]:
                    - strong [ref=e605]: Embedding novelty — the SECONDARY lens.
                    - text: "A \"semantic novelty\" read: it embeds an entity's whole body and measures cosine distance to a pool of structurally similar peers, surfacing code that is"
                    - emphasis [ref=e606]: shaped
                    - text: unlike anything else in the repo. This is the older whole-body signal; it now backs up the decision signal rather than leading it.
                - paragraph [ref=e607]:
                  - text: It is
                  - strong [ref=e608]: not a linter or a gate
                  - text: ; it is an instrument. Use the decision flags to see exactly which conventions your in-progress code diverges from, and the novelty distance to see whether it is structurally unusual.
                - heading "Decision/style conformity (primary)" [level=3] [ref=e609]
                - paragraph [ref=e610]:
                  - text: For each curated axis, the judge compares a function's choice to the
                  - strong [ref=e611]: effective target
                  - text: = a
                  - strong [ref=e612]: descriptive seed
                  - text: "merged with an optional, git-tracked override file:"
                - list [ref=e613]:
                  - listitem [ref=e614]:
                    - strong [ref=e615]: Descriptive seed.
                    - text: The codebase's own
                    - emphasis [ref=e616]: mode
                    - text: per axis — whichever value the existing code uses most (e.g. if 75% of declarations are
                    - code [ref=e617]: const
                    - text: ", the seed target for"
                    - code [ref=e618]: var_decl
                    - text: is
                    - code [ref=e619]: const
                    - text: ). Computed over
                    - emphasis [ref=e620]: substantive
                    - text: decisions only; a function that declares no variables makes no
                    - code [ref=e621]: var_decl
                    - text: decision and is never faulted for it.
                  - listitem [ref=e622]:
                    - strong [ref=e623]:
                      - code [ref=e624]: conformity-target.json
                      - text: (optional, at repo root).
                    - text: A small git-trackable file of accepted preferences,
                    - code [ref=e625]: "{ \"var_decl\": \"const\", ... }"
                    - text: . Any axis you set here
                    - strong [ref=e626]: overrides
                    - text: the descriptive seed (so you can flip the target to a current minority — a deliberate "we're migrating to X" decision) and is
                    - strong [ref=e627]: always enforced
                    - text: ", even past the base-rate guard."
                  - listitem [ref=e628]:
                    - strong [ref=e629]: Base-rate guard.
                    - text: An axis is only enforced when the codebase has enough substantive examples of it (≥ 10 deciders) to have a real preference —
                    - emphasis [ref=e630]: or
                    - text: you've set it explicitly in
                    - code [ref=e631]: conformity-target.json
                    - text: . Axes the codebase barely uses are left un-enforced rather than fabricating a convention from noise.
                - paragraph [ref=e632]:
                  - text: The
                  - strong [ref=e633]:
                    - code [ref=e634]: conformity-target
                  - text: "command is the read-only way to inspect and seed this:"
                - code [ref=e636]: "codebase-pkg conformity-target # show the effective target + per-axis migration progress codebase-pkg conformity-target --init # write a starter conformity-target.json from the current modes codebase-pkg conformity-target --init --force # overwrite an existing one"
                - paragraph [ref=e637]:
                  - text: Show mode is a pure
                  - strong [ref=e638]: lookup against the already-persisted decision facts
                  - text: (the
                  - code [ref=e639]: cfm_decisions
                  - text: table) — it never re-parses or re-embeds the tree. Per axis it prints the target value, whether it came from the seed or an override, whether it's enforced or guarded out, the substantive count, and
                  - strong [ref=e640]: migration progress
                  - text: ": of the functions that decided that axis, what fraction already match the target and how many remain to migrate."
                  - code [ref=e641]: "--init"
                  - text: seeds the file from the current descriptive modes for the enforced axes; edit it, commit it, and both the judge and
                  - code [ref=e642]: conformity-backfill
                  - text: will honor it.
                - paragraph [ref=e643]:
                  - text: The decision axes are extracted with ts-morph, so they cover
                  - strong [ref=e644]: TypeScript/TSX only
                  - text: .
                - heading "Embedding novelty (secondary)" [level=3] [ref=e645]
                - paragraph [ref=e646]:
                  - text: "The novelty lens judges three kinds of code entity, each against a pool of its own kind: functions and methods ("
                  - code [ref=e647]: function:body
                  - text: ), types — classes, interfaces, enums, and type aliases (
                  - code [ref=e648]: type:body
                  - text: ), and module-level constant/config declarations (
                  - code [ref=e649]: module:const
                  - text: ). For each entity it embeds the entity's
                  - strong [ref=e650]: whole body, lightly normalized
                  - text: — comments stripped and whitespace collapsed, but identifiers and literals kept — and measures the cosine distance from that vector to the committed pool of same-category entities. Each category carries its own in-distribution calibrated threshold.
                - paragraph [ref=e651]:
                  - text: It runs
                  - strong [ref=e652]: fully local
                  - text: ": a code-specific embedding model ("
                  - code [ref=e653]: jinaai/jina-embeddings-v2-base-code
                  - text: via
                  - code [ref=e654]: "@xenova/transformers"
                  - text: ", ~162 MB, 768-dimensional, downloaded once then run in-process and offline), with"
                  - code [ref=e655]: Xenova/jina-embeddings-v2-small-en
                  - text: and MiniLM as fallbacks. No external API, no tokens, no cost. Note the one-time download is larger than the earlier small general model — the code model is what makes whole-body similarity separate cleanly.
                - heading "Architecture" [level=3] [ref=e656]
                - paragraph [ref=e657]:
                  - text: Two stores back the feature.
                  - strong [ref=e658]: Neo4j
                  - text: stays the canonical graph (untouched — no conformity data lives in it). A separate
                  - strong [ref=e659]: pgvector Postgres
                  - text: holds the conformity data, keyed by the same node id as the graph (
                  - code [ref=e660]: <filePath>::<name>
                  - text: "): the embedding-novelty vectors live in"
                  - code [ref=e661]: cfm_vectors
                  - text: (with an HNSW cosine ANN index) plus a
                  - code [ref=e662]: cfm_calibration
                  - text: table of per-category thresholds, and the
                  - strong [ref=e663]: decision facts
                  - text: live in
                  - code [ref=e664]: cfm_decisions
                  - text: — one row per
                  - code [ref=e665]: (node_id, axis)
                  - text: — so axis distributions and the migration backlog are plain SQL queries and the decision judge /
                  - code [ref=e666]: conformity-target
                  - text: are a lookup, never a re-scan. When you run
                  - code [ref=e667]: init --docker
                  - text: ", the Postgres/pgvector service is provisioned in the same compose file alongside Neo4j, the schema is bootstrapped once Postgres is reachable, and the embedding model is prefetched."
                - heading "Workflow" [level=3] [ref=e668]
                - code [ref=e670]: "# 1. Provision Neo4j + pgvector Postgres and prefetch the model codebase-pkg init --docker docker compose -f docker-compose.codebase-pkg.yml up -d # 2. Seed the Neo4j graph as usual codebase-pkg seed # 3. One-time: persist the decision facts (the PRIMARY signal) AND embed every # committed entity into the novelty pools + calibrate the per-category thresholds codebase-pkg conformity-backfill # 4. (optional) Inspect the effective decision target + migration, and seed a # git-tracked conformity-target.json you can edit to set accepted preferences codebase-pkg conformity-target codebase-pkg conformity-target --init # 5. Judge your working-tree code: decision/style flags (primary) + novelty (secondary) codebase-pkg conformity-judge # all uncommitted changes in watched dirs codebase-pkg conformity-judge src/foo.ts # or a single file"
                - paragraph [ref=e671]:
                  - code [ref=e672]: conformity-backfill
                  - text: does two passes. The
                  - strong [ref=e673]: decision pass
                  - text: extracts and persists the per-entity style facts into
                  - code [ref=e674]: cfm_decisions
                  - text: ", then logs the effective target (seed merged with"
                  - code [ref=e675]: conformity-target.json
                  - text: ) and per-axis migration progress. The
                  - strong [ref=e676]: novelty pass
                  - text: embeds every committed entity (functions, types, and module-level constants) and, as its final step,
                  - strong [ref=e677]: calibrates
                  - text: "the verdict: per category it takes the 95th percentile of the leave-one-out kNN distances over that category's in-repo pool, so roughly 95% of the codebase's own code reads as \"conforms\". That threshold is stored in a"
                  - code [ref=e678]: cfm_calibration
                  - text: table. If you later tune the calibration or grow the pool via sync and want to refresh thresholds
                  - strong [ref=e679]: without re-embedding
                  - text: ", run"
                  - code [ref=e680]: codebase-pkg conformity-calibrate
                  - text: — it re-reads the stored vectors and recomputes the thresholds (no model load). To inspect or re-seed the decision target on demand without any re-parse, use
                  - code [ref=e681]: codebase-pkg conformity-target
                  - text: .
                - paragraph [ref=e682]:
                  - text: After the one-time backfill, normal
                  - code [ref=e683]: codebase-pkg sync
                  - text: "keeps the pool fresh: it re-embeds changed entities and removes vectors for deleted ones as a best-effort, non-fatal step (a failure or unreachable Postgres warns but never blocks the sync cursor). You can also judge from a Claude Code session via the"
                  - code [ref=e684]: judgeConformity
                  - text: MCP tool.
                - heading "The judgeConformity MCP tool" [level=3] [ref=e685]:
                  - text: The
                  - code [ref=e686]: judgeConformity
                  - text: MCP tool
                - paragraph [ref=e687]:
                  - text: The 8th MCP tool. Input
                  - code [ref=e688]: "{ filePath?, maxResults? }"
                  - text: (with no
                  - code [ref=e689]: filePath
                  - text: ", it judges the uncommitted staged + unstaged + untracked working-tree changes in watched dirs;"
                  - code [ref=e690]: maxResults
                  - text: caps the nearest neighbors reported per entity and the kNN window, default 5). It leads with the
                  - strong [ref=e691]: style-conformity
                  - text: report — per-function off-target decisions against the effective target — then the
                  - strong [ref=e692]: embedding-novelty
                  - text: report. For novelty it returns, per entity, its category (
                  - code [ref=e693]: function:body
                  - text: ","
                  - code [ref=e694]: type:body
                  - text: ", or"
                  - code [ref=e695]: module:const
                  - text: ), distance, a verdict (
                  - code [ref=e696]: conforms
                  - text: /
                  - code [ref=e697]: outlier
                  - text: ), the
                  - strong [ref=e698]: threshold
                  - text: the verdict was decided against and whether that threshold was
                  - strong [ref=e699]: calibrated
                  - text: ", and the nearest existing entities of the same kind — leading with the outliers. Each entity is judged against its category's pool"
                  - emphasis [ref=e700]: minus its own committed vector
                  - text: ", so a committed entity is compared to other code, never to itself. Before"
                  - code [ref=e701]: conformity-backfill
                  - text: /
                  - code [ref=e702]: conformity-calibrate
                  - text: has run there is no calibrated threshold, so verdicts fall back to a default and are flagged
                  - code [ref=e703]: "calibrated: false"
                  - text: — in that state the distance and nearest-neighbor list remain the trustworthy signal. If conformity is disabled or Postgres is unreachable, it returns a plain message explaining how to enable it rather than erroring.
                - heading "Caveats" [level=3] [ref=e704]
                - list [ref=e705]:
                  - listitem [ref=e706]:
                    - strong [ref=e707]: Decision axes are TypeScript-only.
                    - text: The decision extractor uses ts-morph, so style-conformity covers
                    - code [ref=e708]: .ts
                    - text: /
                    - code [ref=e709]: .tsx
                    - text: functions, methods, and arrows only — not Python or other languages.
                  - listitem [ref=e710]:
                    - strong [ref=e711]: The decision axes don't cover everything.
                    - text: The curated set is
                    - code [ref=e712]: var_decl
                    - text: ","
                    - code [ref=e713]: string_style
                    - text: ","
                    - code [ref=e714]: async_style
                    - text: ","
                    - code [ref=e715]: array_syntax
                    - text: ","
                    - code [ref=e716]: export_style
                    - text: . Bare statements and destructuring-pattern declarations are not modeled as decisions, and a function that makes no decision on an axis (the axis's
                    - emphasis [ref=e717]: absence
                    - text: value) is never faulted on it.
                  - listitem [ref=e718]:
                    - strong [ref=e719]: Embedding novelty is a separate lens.
                    - text: The two signals answer different questions — "did this code follow our conventions?" (decisions) vs. "is this code shaped unlike anything else?" (embedding distance). A clean style report does not imply low novelty, and vice versa.
                  - listitem [ref=e720]:
                    - strong [ref=e721]: Some declarations aren't chunked yet.
                    - text: The judge covers functions/methods (
                    - code [ref=e722]: function:body
                    - text: ), types (
                    - code [ref=e723]: type:body
                    - text: ), and module-level const/var declarations (
                    - code [ref=e724]: module:const
                    - text: ), but the parser does not yet chunk bare top-level statements (side-effect calls), destructuring-pattern declarations, or Python module-level assignments — those entities aren't judged.
                  - listitem [ref=e725]:
                    - strong [ref=e726]: The conformity signal separates best against genuinely different code.
                    - text: In our validation it cleanly distinguishes unrelated code, but is more modest against same-author / same-domain code that already looks alike. Read the distance and nearest-neighbor list, not just the label.
                  - listitem [ref=e727]:
                    - strong [ref=e728]: Before backfill/calibration the threshold is uncalibrated.
                    - text: A judged function reports
                    - code [ref=e729]: "calibrated: false"
                    - text: and falls back to a default cut until
                    - code [ref=e730]: conformity-backfill
                    - text: (or
                    - code [ref=e731]: conformity-calibrate
                    - text: ) has run; in that state the distance and nearest neighbors are the trustworthy signal.
                  - listitem [ref=e732]:
                    - strong [ref=e733]: The Python parser does not yet capture default-parameter values
                    - text: — only TypeScript/TSX functions surface default-position information. This is unrelated to the whole-body embedding (which uses the body text directly), but the parser distinction still stands.
                  - listitem [ref=e734]:
                    - strong [ref=e735]: End-to-end against live Neo4j + Postgres still wants a smoke test.
                    - text: The engine is unit-tested with fakes; a full run against provisioned services has not been exercised here.
                - heading "CLI reference" [level=2] [ref=e736]
                - code [ref=e738]: "# Lifecycle (all accept --path/--root <dir> or CODEBASE_PKG_ROOT to set the install root) codebase-pkg init [--local] [--docker] [--force] [--dry-run] [--path <dir>] [--neo4j-uri <uri>] [--pg-uri <uri>] codebase-pkg upgrade [--plan] [--confirm] [--force] [--verbose] [--path <dir>] codebase-pkg status [--path <dir>] codebase-pkg doctor [--no-network] [--path <dir>] codebase-pkg uninstall --confirm [--force] [--dry-run] [--path <dir>] codebase-pkg reset [--graph-only|--conformity-only] [--reseed] --confirm [--dry-run] [--path <dir>] [--neo4j-uri <uri>] [--pg-uri <uri>] # Graph operations codebase-pkg seed # initial full graph build codebase-pkg sync # incremental sync since last commit codebase-pkg validate # run integrity checks against the graph codebase-pkg backfill-changes # populate Change nodes from git history codebase-pkg add-constraint --file constraints.json [--validate] # Conformity Judge (see below) codebase-pkg conformity-backfill # one-time: persist decision facts + embed all entities, then calibrate codebase-pkg conformity-calibrate # recompute per-category outlier thresholds (no re-embed) codebase-pkg conformity-target [--init] [--force] # show the effective decision target + migration, or seed conformity-target.json codebase-pkg conformity-judge [file] # judge working-tree code (or one file): style flags (primary) + novelty (secondary)"
